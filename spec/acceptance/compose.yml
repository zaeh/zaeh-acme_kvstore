---
# Services for the acceptance tests (bundle exec rake acceptance). All
# credentials here are throwaway test values, never real secrets.
name: acme_kvstore_acceptance

services:
  consul:
    image: hashicorp/consul:1.22.7
    command: [agent, -dev, -client, 0.0.0.0]
    environment:
      CONSUL_LOCAL_CONFIG: >-
        {"acl": {"enabled": true, "default_policy": "deny",
        "tokens": {"initial_management": "acceptance-test-management-token"}}}
    ports:
      - 127.0.0.1:18500:8500
    healthcheck:
      test: [CMD, consul, info, -token=acceptance-test-management-token]
      interval: 2s
      retries: 30

  redis:
    image: redis:7.4.11
    ports:
      - 127.0.0.1:16379:6379
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      retries: 30

  pebble:
    image: ghcr.io/letsencrypt/pebble:2.10.1
    environment:
      PEBBLE_VA_ALWAYS_VALID: '1'
      PEBBLE_VA_NOSLEEP: '1'
    ports:
      - 127.0.0.1:14000:14000
      - 127.0.0.1:15000:15000

  # End-to-end tests (profile e2e, `bundle exec rake acceptance:e2e`): an
  # OpenVox server compiling the module, an ACME worker and a consumer node.
  openvoxserver:
    profiles: [e2e]
    build:
      context: e2e
      dockerfile: server.Dockerfile
    image: acme_kvstore_e2e_server
    hostname: openvoxserver
    environment:
      DNS_ALT_NAMES: openvoxserver
      USE_OPENVOXDB: 'false'
      OPENVOXSERVER_ENVIRONMENT_TIMEOUT: '0'
      OPENVOXSERVER_JAVA_ARGS: -Xms512m -Xmx1024m
    volumes:
      - ../..:/etc/puppetlabs/code/environments/production/modules/acme_kvstore:ro
      - ../fixtures/modules/stdlib:/etc/puppetlabs/code/environments/production/modules/stdlib:ro
      - ../fixtures/modules/vcsrepo:/etc/puppetlabs/code/environments/production/modules/vcsrepo:ro
    healthcheck:
      test: [CMD, /healthcheck.sh]
      interval: 5s
      retries: 60

  worker:
    profiles: [e2e]
    build: &agent
      context: e2e
      dockerfile: agent-${E2E_OS:-ubuntu24.04}.Dockerfile
      args:
        AGENT_VERSION: 8.29.0
    image: acme_kvstore_e2e_agent:${E2E_OS:-ubuntu24.04}
    hostname: worker
    domainname: acceptance.test

  consumer:
    profiles: [e2e]
    build: *agent
    image: acme_kvstore_e2e_agent:${E2E_OS:-ubuntu24.04}
    hostname: consumer
    domainname: acceptance.test
