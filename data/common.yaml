---
# Defaults of the class parameters (undef defaults and worker::home stay
# in the manifests). Hash parameters are deep-merged across Hiera levels.
lookup_options:
  acme_kvstore::workers:
    merge: deep
  acme_kvstore::areas:
    merge: deep
  acme_kvstore::consul:
    merge: deep
  acme_kvstore::redis:
    merge: deep
  acme_kvstore::dns_profiles:
    merge: deep
  acme_kvstore::dnsapi_scripts:
    merge: deep
  acme_kvstore::ca_profiles:
    merge: deep
  acme_kvstore::certificates:
    merge: deep

acme_kvstore::prefix: 'acme'
acme_kvstore::backend: 'consul'
acme_kvstore::workers: {}
acme_kvstore::areas: {}
acme_kvstore::consul: {}
acme_kvstore::redis: {}
acme_kvstore::dns_profiles: {}
acme_kvstore::dnsapi_scripts: {}
acme_kvstore::ca_profiles:
  letsencrypt: {}
  letsencrypt_test: {}
acme_kvstore::default_ca_profile: 'letsencrypt'
acme_kvstore::ca_whitelist:
  - 'letsencrypt'
  - 'letsencrypt_test'
acme_kvstore::exec_timeout: 300
acme_kvstore::renew_before_days: 30
acme_kvstore::purge_key_on_mismatch: true
acme_kvstore::store_issuers: true
acme_kvstore::dnssleep: 60
acme_kvstore::dh_param_size: 2048
acme_kvstore::kv_client: 'puppet'
acme_kvstore::certificates: {}

acme_kvstore::worker::install_method: 'git'
acme_kvstore::worker::acme_git_url: 'https://github.com/acmesh-official/acme.sh.git'
acme_kvstore::worker::acme_git_force: false
acme_kvstore::worker::acme_version: '3.0.9'
acme_kvstore::worker::manage_packages: true
acme_kvstore::worker::manage_gems: true
acme_kvstore::worker::manage_user: false
acme_kvstore::worker::user: 'root'
acme_kvstore::worker::group: 'root'
acme_kvstore::worker::webroot: '/var/www/acme-challenge'
acme_kvstore::worker::acme_log_file: '/var/log/acme.sh/acme.log'
acme_kvstore::worker::acme_log_level: 1
acme_kvstore::worker::manage_log_dir: true
acme_kvstore::worker::config_dir: '/etc/acme_kvstore'
